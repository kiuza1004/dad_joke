<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아재개그 생성기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn back-btn" id="backBtn" hidden aria-label="뒤로">←</button>
    <h1 id="topTitle">아재개그 생성기</h1>
    <div class="topbar-actions" id="topActions"></div>
  </header>

  <main id="app"></main>

  <div class="snackbar" id="snackbar" hidden></div>

  <template id="tpl-home">
    <section class="page">
      <label class="field">
        <span>주제 (선택)</span>
        <input type="text" id="keyword" placeholder="예: 커피, 회사, 동물" />
      </label>

      <button class="primary-btn" id="generateBtn">
        <span class="btn-label">✨ 아재개그 만들기</span>
      </button>

      <div class="card batch-controls">
        <div class="batch-title">여러 개 모아 생성</div>
        <div class="batch-desc">위 주제로 N개를 한 번에 생성해 아래 목록에 추가합니다.</div>
        <div class="batch-row">
          <button class="icon-btn" id="batchDec" aria-label="감소">−</button>
          <input type="number" id="batchCount" min="2" max="30" value="10" />
          <button class="icon-btn" id="batchInc" aria-label="증가">＋</button>
          <button class="outlined-btn" id="batchGen">
            <span id="batchGenLabel">10개 생성</span>
          </button>
        </div>
        <div class="batch-hint">분당 호출 한도가 있어 큰 숫자는 자동으로 나눠 호출됩니다. (최대 30)</div>
      </div>

      <div class="card progress-card" id="progressCard" hidden>
        <div class="progress-title" id="progressTitle"></div>
        <div class="progress-bar"><div id="progressFill"></div></div>
        <div class="progress-stat" id="progressStat"></div>
      </div>

      <div class="card waiting" id="waitingCard" hidden></div>
      <div class="card error" id="errorCard" hidden></div>

      <div class="pending-section" id="pendingSection" hidden>
        <div class="section-header">
          <span class="section-title" id="pendingTitle"></span>
          <button class="text-btn danger" id="clearAllPending">전체 삭제</button>
        </div>
        <div id="pendingList"></div>
      </div>
    </section>
  </template>

  <template id="tpl-favorites">
    <section class="page">
      <div class="filter-row" id="filterRow"></div>
      <div id="favList" class="fav-list"></div>
      <div id="favEmpty" class="empty" hidden>저장된 개그가 없습니다.</div>
      <button class="fab" id="fabAdd" aria-label="개그 추가">＋</button>
    </section>
  </template>

  <template id="tpl-joke-card">
    <div class="card joke-card">
      <div class="joke-category"></div>
      <div class="qa">
        <div class="qa-label">Q.</div>
        <div class="qa-text question"></div>
      </div>
      <div class="qa">
        <div class="qa-label">A.</div>
        <div class="qa-text answer"></div>
      </div>
      <div class="explanation" hidden></div>
      <div class="row gap card-actions">
        <button class="outlined-btn discard">버리기</button>
        <button class="primary-btn save">🔖 저장하기</button>
      </div>
    </div>
  </template>

  <template id="tpl-fav-card">
    <div class="card fav-card">
      <div class="fav-head">
        <div class="fav-meta">
          <span class="fav-category"></span>
          <span class="fav-custom" hidden>✍️ 직접 추가</span>
        </div>
        <div class="row">
          <button class="icon-btn star" aria-label="별표">☆</button>
          <button class="icon-btn edit" aria-label="수정">✎</button>
          <button class="icon-btn delete" aria-label="삭제">🗑</button>
        </div>
      </div>
      <div class="qa">
        <div class="qa-label">Q.</div>
        <div class="qa-text question"></div>
      </div>
      <div class="qa">
        <div class="qa-label">A.</div>
        <div class="qa-text answer"></div>
      </div>
      <div class="explanation" hidden></div>
    </div>
  </template>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <input type="file" id="filePicker" accept=".json,application/json" hidden />

  <script type="module" src="app.js"></script>
</body>
</html>
